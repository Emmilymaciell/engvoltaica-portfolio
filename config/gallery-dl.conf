{
    "_comment": "Config do gallery-dl para o acervo Engvoltaica. NUNCA colocar cookies, senha ou token aqui — a sessao vem do navegador via --cookies-from-browser, em memoria.",

    "extractor": {
        "base-directory": "data/raw/instagram/_staging",
        "archive": "state/gallery-dl-archive.sqlite3",
        "sleep-request": [1.5, 3.5],
        "retries": 4,
        "timeout": 30.0,

        "instagram": {
            "directory": [],
            "filename": "{shortcode}_{num:>02}.{extension}",
            "include": "posts",
            "videos": true,
            "postprocessors": [
                {
                    "name": "metadata",
                    "mode": "json",
                    "directory": "../metadata",
                    "filename": "{shortcode}_{num:>02}.json"
                }
            ]
        }
    },

    "downloader": {
        "part": true,
        "progress": 3.0,
        "rate": null
    },

    "output": {
        "mode": "auto",
        "progress": true,
        "log": {
            "level": "info",
            "format": "{name}: {message}"
        }
    }
}
